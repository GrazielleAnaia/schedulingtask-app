app:
  kafka:
    topic:
      replication-factor: 1
      min-insync-replicas: 1

spring:
  cloud:
    config:
      enabled: false

  mongodb:
    uri: mongodb://localhost:27017/scheduling-test
    database: scheduling-test

  kafka:
    bootstrap-servers: localhost:9092
#    admin:
#      fail-fast: false
#      operation-timeout: 60s
#      properties:
#        request.timeout.ms: 60000
#        default.api.timeout.ms: 60000
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
      acks: all
      properties:
        enable:
          idempotence: true
        max:
          in:
            flight:
              requests:
                per:
                  connection: 5
        delivery:
          timeout:
            ms: 120000
        linger:
          ms: 0
        request:
          timeout:
            ms: 30000

eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false

management:
  health:
    rabbit:
      enabled: false
    mongo:
      enabled: true

client:
  type: http